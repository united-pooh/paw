[project]
name = "quant-mcp"
version = "0.2.0"
description = "AI量化交易 MCP 服务器：反过拟合、最优执行、Regime 检测、死亡方式体检、多智能体模拟、行情数据、SQLite 模拟盘"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.26",
    "numpy>=1.26",
    "pandas>=2.0",
    "akshare>=1.14",
    "baostock>=0.8.9",
]

[project.optional-dependencies]
tushare = ["tushare>=1.2.89"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
