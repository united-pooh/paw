<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="560" viewBox="0 0 1260 560">
  <rect width="1260" height="560" fill="#282c34"/>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; font-size: 25px; font-weight: 700; }
    .title { fill: #f3f3f3; font-size: 27px; }
    .muted { fill: #9aa0a6; }
    .ok { fill: #75a878; }
    .added { fill: #dcffdf; }
    .deleted { fill: #ffe0e0; }
    .rail { stroke: #75a878; stroke-width: 2; }
    .panel { fill: #20242c; stroke: #3a404c; stroke-width: 2; rx: 8; }
  </style>

  <rect x="30" y="30" width="585" height="500" class="panel"/>
  <rect x="645" y="30" width="585" height="500" class="panel"/>

  <text x="58" y="78" class="mono title">A. 行号在 + 左边（+/- 对齐 ✓）</text>
  <text x="673" y="78" class="mono title">B. 行号在 + 右边（当前版本）</text>

  <line x1="58" y1="122" x2="58" y2="488" class="rail"/>
  <text x="112" y="150" class="mono ok">✓ Write · ok</text>
  <text x="112" y="188" class="mono muted">src/main.py</text>
  <rect x="102" y="218" width="470" height="40" fill="#145f2a" rx="2"/>
  <text x="104" y="246" class="mono added" text-anchor="end">1</text>
  <text x="112" y="246" class="mono added">+ │ def hanoi(n, source):</text>
  <rect x="102" y="266" width="470" height="40" fill="#145f2a" rx="2"/>
  <text x="104" y="294" class="mono added" text-anchor="end">2</text>
  <text x="112" y="294" class="mono added">+ │     if n == 1:</text>
  <rect x="102" y="314" width="470" height="40" fill="#6b1f1f" rx="2"/>
  <text x="104" y="342" class="mono deleted" text-anchor="end">8</text>
  <text x="112" y="342" class="mono deleted">- │     return old_value</text>
  <text x="112" y="402" class="mono muted">特点：行号在前，+ / - 和 ✓ 同列。</text>
  <text x="112" y="440" class="mono muted">扫状态时最稳，行号也不会抢主视觉。</text>

  <line x1="673" y1="122" x2="673" y2="488" class="rail"/>
  <text x="701" y="150" class="mono ok">✓ Write · ok</text>
  <text x="727" y="188" class="mono muted">src/main.py</text>
  <rect x="717" y="218" width="470" height="40" fill="#145f2a" rx="2"/>
  <text x="727" y="246" class="mono added">+    1 │ def hanoi(n, source):</text>
  <rect x="717" y="266" width="470" height="40" fill="#145f2a" rx="2"/>
  <text x="727" y="294" class="mono added">+    2 │     if n == 1:</text>
  <rect x="717" y="314" width="470" height="40" fill="#6b1f1f" rx="2"/>
  <text x="727" y="342" class="mono deleted">-    8 │     return old_value</text>
  <text x="727" y="402" class="mono muted">特点：符号先出现，这是现在的版本。</text>
  <text x="727" y="440" class="mono muted">读 diff 时第一眼先扫 + / -。</text>
</svg>
